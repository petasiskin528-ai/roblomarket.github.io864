<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>RobloMarket - Скупка предметов Roblox</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body.dark {
            --bg: #0a0a0a;
            --card-bg: #1a1a1a;
            --header-bg: #0f0f0f;
            --tab-bar: #0f0f0f;
            --input-bg: #252525;
            --text-primary: #ffffff;
            --text-secondary: #aaaaaa;
            --success: #2e7d32;
            --error: #d32f2f;
            --warning: #ff9800;
            --primary: #4caf50;
            --primary-dark: #388e3c;
            --border: #2a2a2a;
            --shadow: 0 4px 15px rgba(0,0,0,0.3);
            --gradient-start: #4caf50;
            --gradient-end: #2e7d32;
        }

        body.light {
            --bg: #f5f7fa;
            --card-bg: #ffffff;
            --header-bg: #ffffff;
            --tab-bar: #ffffff;
            --input-bg: #f0f2f5;
            --text-primary: #1a1a2e;
            --text-secondary: #666666;
            --success: #2e7d32;
            --error: #d32f2f;
            --warning: #ff9800;
            --primary: #4caf50;
            --primary-dark: #388e3c;
            --border: #e0e0e0;
            --shadow: 0 4px 15px rgba(0,0,0,0.08);
            --gradient-start: #4caf50;
            --gradient-end: #2e7d32;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg);
            color: var(--text-primary);
            min-height: 100vh;
        }

        .app {
            max-width: 600px;
            margin: 0 auto;
            min-height: 100vh;
            background: var(--bg);
            padding-bottom: 85px;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 18px;
            background: var(--header-bg);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        
        .logo {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .logo-icon {
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, var(--gradient-start), var(--gradient-end));
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: var(--shadow);
        }
        
        .logo-icon img {
            width: 24px;
            height: 24px;
            filter: brightness(0) invert(1);
        }
        
        .header h1 {
            font-size: 20px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--gradient-start), var(--gradient-end));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        
        .header-right {
            display: flex;
            align-items: center;
            gap: 14px;
        }
        
        .theme-toggle {
            background: var(--input-bg);
            border: none;
            font-size: 18px;
            cursor: pointer;
            border-radius: 50%;
            width: 38px;
            height: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            box-shadow: var(--shadow);
        }
        
        .chat-icon-btn {
            background: var(--input-bg);
            border: none;
            font-size: 18px;
            cursor: pointer;
            border-radius: 50%;
            width: 38px;
            height: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            transition: all 0.2s ease;
            box-shadow: var(--shadow);
        }
        
        .unread-badge {
            position: absolute;
            top: -4px;
            right: -4px;
            background: var(--error);
            color: white;
            font-size: 10px;
            font-weight: bold;
            min-width: 18px;
            height: 18px;
            border-radius: 9px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 4px;
        }
        
        .avatar {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--gradient-start), var(--gradient-end));
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            color: white;
            transition: all 0.2s ease;
            box-shadow: var(--shadow);
        }
        
        .user-menu {
            position: absolute;
            top: 65px;
            right: 16px;
            background: var(--card-bg);
            border-radius: 16px;
            border: 1px solid var(--border);
            overflow: hidden;
            z-index: 200;
            min-width: 190px;
            box-shadow: var(--shadow);
        }
        
        .user-menu button {
            width: 100%;
            padding: 14px 18px;
            background: none;
            border: none;
            color: var(--text-primary);
            text-align: left;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s ease;
        }
        
        .user-menu button:hover {
            background: var(--input-bg);
        }
        
        .tab-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            max-width: 600px;
            margin: 0 auto;
            background: rgba(15, 15, 15, 0.95);
            backdrop-filter: blur(10px);
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: space-around;
            padding: 8px 12px 14px;
            z-index: 100;
            overflow-x: auto;
        }
        
        .tab-btn {
            background: none;
            border: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            color: var(--text-secondary);
            font-size: 10px;
            font-weight: 600;
            padding: 6px 12px;
            border-radius: 30px;
            transition: all 0.25s ease;
            white-space: nowrap;
        }
        
        .tab-btn.active {
            color: var(--primary);
            background: rgba(76, 175, 80, 0.15);
            transform: translateY(-2px);
        }
        
        .tab-icon {
            font-size: 22px;
        }
        
        .content {
            padding: 16px;
        }
        
        .mode-tabs {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 8px;
            margin-bottom: 16px;
        }
        
        .mode-tab {
            padding: 8px 16px;
            background: var(--input-bg);
            border: none;
            border-radius: 30px;
            color: var(--text-secondary);
            font-weight: 600;
            white-space: nowrap;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 13px;
        }
        
        .mode-tab.active {
            background: linear-gradient(135deg, var(--gradient-start), var(--gradient-end));
            color: white;
            box-shadow: var(--shadow);
        }
        
        .search-input {
            width: 100%;
            padding: 12px 16px;
            background: var(--input-bg);
            border: 1px solid var(--border);
            border-radius: 30px;
            color: var(--text-primary);
            font-size: 15px;
            margin-bottom: 16px;
        }
        
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(155px, 1fr));
            gap: 12px;
            margin-bottom: 20px;
        }
        
        .product-card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 12px;
            text-align: center;
            transition: all 0.2s ease;
            border: 2px solid transparent;
            position: relative;
            box-shadow: var(--shadow);
        }
        
        .product-card.selectable {
            cursor: pointer;
        }
        
        .product-card.selectable.selected {
            border-color: var(--success);
            transform: scale(1.02);
        }
        
        .product-image {
            width: 70px;
            height: 70px;
            margin: 0 auto 10px;
            border-radius: 12px;
            overflow: hidden;
            background: var(--input-bg);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .product-image img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        
        .product-name {
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 4px;
            line-height: 1.3;
        }
        
        .product-quantity {
            font-size: 11px;
            color: var(--text-secondary);
            margin-top: 4px;
        }
        
        .check-mark {
            position: absolute;
            top: 6px;
            right: 6px;
            width: 22px;
            height: 22px;
            background: var(--success);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            color: white;
        }
        
        .tab-bar button {
            user-select: none;
        }

        .floating-bar {
            position: fixed;
            bottom: 85px;
            left: 50%;
            transform: translateX(-50%);
            max-width: 90%;
            width: auto;
            min-width: 300px;
            background: linear-gradient(135deg, var(--gradient-start), var(--gradient-end));
            border-radius: 50px;
            padding: 14px 24px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            z-index: 99;
            box-shadow: 0 6px 25px rgba(76, 175, 80, 0.5);
        }
        
        .floating-info {
            font-weight: bold;
            font-size: 15px;
            color: white;
        }
        
        .floating-btn {
            background: rgba(255,255,255,0.2);
            color: white;
            border: none;
            padding: 8px 24px;
            border-radius: 40px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
        }
        
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(5px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 20px;
        }
        
        .modal-content {
            background: var(--card-bg);
            border-radius: 28px;
            padding: 24px;
            max-width: 400px;
            width: 100%;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: var(--shadow);
        }
        
        .btn {
            background: linear-gradient(135deg, var(--gradient-start), var(--gradient-end));
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 40px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            font-size: 14px;
        }
        
        .btn-success {
            background: linear-gradient(135deg, #2e7d32, #1b5e20);
        }
        
        .btn-danger {
            background: linear-gradient(135deg, #d32f2f, #b71c1c);
        }
        
        .stats-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            gap: 12px;
            margin: 20px 0;
        }
        
        .stat-card {
            flex: 1;
            min-width: 100px;
            background: var(--card-bg);
            border-radius: 20px;
            padding: 16px 12px;
            text-align: center;
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
        }
        
        .stat-value {
            font-size: 18px;
            font-weight: bold;
            color: var(--success);
            margin-bottom: 6px;
        }
        
        .stat-label {
            font-size: 10px;
            color: var(--text-secondary);
            line-height: 1.3;
        }
        
        .exchange-rate {
            background: var(--input-bg);
            border-radius: 30px;
            padding: 10px 16px;
            font-size: 13px;
            color: var(--text-secondary);
            text-align: center;
            margin-bottom: 16px;
            cursor: pointer;
        }
        
        .empty-state {
            text-align: center;
            padding: 40px;
            color: var(--text-secondary);
        }
        
        .page-title {
            font-size: 26px;
            font-weight: bold;
            margin-bottom: 8px;
            background: linear-gradient(135deg, var(--gradient-start), var(--gradient-end));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        
        .page-subtitle {
            color: var(--text-secondary);
            font-size: 14px;
            margin-bottom: 24px;
        }
        
        .balance-card {
            background: linear-gradient(135deg, var(--gradient-start), var(--gradient-end));
            border-radius: 24px;
            padding: 24px;
            margin-bottom: 20px;
            text-align: center;
            color: white;
        }
        
        .balance-amount {
            font-size: 42px;
            font-weight: bold;
            margin: 10px 0;
        }
        
        .history-item {
            padding: 12px;
            border-bottom: 1px solid var(--border);
        }
        
        .history-date {
            font-size: 10px;
            color: var(--text-secondary);
        }
        
        .frozen-card {
            background: var(--input-bg);
            border-radius: 20px;
            padding: 16px;
            margin-bottom: 16px;
            border-left: 4px solid var(--warning);
        }
        
        .chat-container {
            display: flex;
            flex-direction: column;
            height: 70vh;
        }
        
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        
        .message {
            max-width: 80%;
            padding: 10px 14px;
            border-radius: 20px;
            font-size: 14px;
        }
        
        .message-out {
            background: linear-gradient(135deg, var(--gradient-start), var(--gradient-end));
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }
        
        .message-in {
            background: var(--input-bg);
            color: var(--text-primary);
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }
        
        .message-time {
            font-size: 9px;
            margin-top: 4px;
            opacity: 0.7;
        }
        
        .chat-input-area {
            display: flex;
            gap: 8px;
            padding: 12px;
            background: var(--card-bg);
            border-top: 1px solid var(--border);
        }
        
        .chat-input {
            flex: 1;
            padding: 12px 18px;
            background: var(--input-bg);
            border: 1px solid var(--border);
            border-radius: 30px;
            color: var(--text-primary);
            font-size: 14px;
        }
        
        .chat-send-btn {
            background: linear-gradient(135deg, var(--gradient-start), var(--gradient-end));
            border: none;
            border-radius: 50%;
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 18px;
            color: white;
        }
        
        .chat-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            background: var(--card-bg);
            border-radius: 20px;
            margin-bottom: 8px;
            cursor: pointer;
            border: 1px solid var(--border);
        }
        
        .chat-avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--gradient-start), var(--gradient-end));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: white;
        }
        
        .chat-info {
            flex: 1;
        }
        
        .chat-name {
            font-weight: bold;
            font-size: 14px;
        }
        
        .chat-last-message {
            font-size: 11px;
            color: var(--text-secondary);
        }
        
        .quantity-control {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin: 20px 0;
        }
        
        .quantity-btn {
            background: var(--input-bg);
            border: 1px solid var(--border);
            width: 44px;
            height: 44px;
            border-radius: 50%;
            font-size: 24px;
            cursor: pointer;
            color: var(--text-primary);
        }
        
        .scup-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px;
            background: var(--card-bg);
            border-radius: 16px;
            margin-bottom: 8px;
            border: 1px solid var(--border);
        }
        
        .scup-info {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        
        .scup-badge {
            background: var(--success);
            border-radius: 20px;
            padding: 4px 8px;
            font-size: 10px;
            color: white;
        }
        
        .scup-badge-verified {
            background: linear-gradient(135deg, #ff9800, #ff5722);
            border-radius: 20px;
            padding: 4px 8px;
            font-size: 10px;
            color: white;
        }
        
        .stats-cards {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin: 20px 0;
        }
        
        .stat-card-big {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 16px;
            text-align: center;
            border: 1px solid var(--border);
        }
        
        .stat-value-big {
            font-size: 28px;
            font-weight: bold;
            color: var(--success);
        }
        
        .stat-label-big {
            font-size: 12px;
            color: var(--text-secondary);
        }
        
        .chart-container {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 16px;
            margin: 16px 0;
            border: 1px solid var(--border);
        }
        
        .cookie-display {
            background: var(--input-bg);
            border-radius: 12px;
            padding: 8px;
            margin-top: 8px;
            font-size: 10px;
            color: var(--text-secondary);
            word-break: break-all;
        }
        
        .purchase-card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 16px;
            margin-bottom: 12px;
            border: 1px solid var(--border);
            position: relative;
        }
        
        .copy-btn {
            background: var(--input-bg);
            border: 1px solid var(--border);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 11px;
            cursor: pointer;
            margin-top: 8px;
            color: var(--text-primary);
        }
        
        .hidden {
            display: none !important;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: var(--text-secondary);
        }
        
        .withdraw-request {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 16px;
            margin-bottom: 12px;
            border: 1px solid var(--border);
        }
        
        .withdraw-request-actions {
            display: flex;
            gap: 8px;
            margin-top: 12px;
        }
        
        .status-pending {
            color: var(--warning);
        }
        
        .status-completed {
            color: var(--success);
        }
        
        .price-edit-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px;
            border-bottom: 1px solid var(--border);
        }
        
        .price-edit-row input {
            width: 80px;
            padding: 6px;
            background: var(--input-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-primary);
        }
        
        .price-edit-row button {
            width: auto;
            padding: 6px 12px;
            margin-left: 8px;
        }
        
        .lot-items-list {
            margin: 8px 0;
            padding-left: 14px;
            text-align: left;
            font-size: 13px;
        }
    </style>
</head>

        async function createCryptoBotInvoice(amount, description) {

                    method: 'POST',
                    headers: { 'Crypto-Pay-API-Token': CRYPTO_BOT_TOKEN, 'Content-Type': 'application/json' },

                });
                const data = await response.json();
                if (data.ok && data.result) {
                    const invoiceUrl = data.result.mini_app_invoice_url || data.result.pay_url;
                    if (tg) {
                        if (data.result.mini_app_invoice_url) tg.openTelegramLink(data.result.mini_app_invoice_url);
                        else tg.openLink(data.result.pay_url);
                    } else {
                        window.open(invoiceUrl, '_blank');
                    }
                    return data.result;
                }
                return null;
            } catch (error) { 
                console.error("Ошибка автопополнения:", error);
                return null; 
            }
        }

        async function buyAsScup(orderId) {
            if (!db) return;
            const orderRef = db.collection('orders').doc(orderId);
            const userRef = db.collection('users').doc(currentUser.id.toString());
            let sellerIdForChat = null;
            let sellerNameForChat = null;
            
            try {
                await db.runTransaction(async (transaction) => {
                    const orderDoc = await transaction.get(orderRef);
                    if (!orderDoc.exists) throw "Лот не существует";
                    
                    const orderData = orderDoc.data();
                    if (orderData.status !== 'pending') {
                        throw "Этот лот уже выкуплен другим пользователем!";
                    }
                    
                    sellerIdForChat = orderData.sellerId;
                    sellerNameForChat = orderData.sellerName;
                    
                    const totalUsd = orderData.totalUsd;
                    const commissionRate = getCommissionRate();
                    const totalWithCommission = totalUsd + (totalUsd * commissionRate);
                    const rubAmount = totalWithCommission * exchangeRate;
                    
                    const userDoc = await transaction.get(userRef);
                    const currentBalance = userDoc.data().balance || 0;
                    const currentFrozen = userDoc.data().frozenBalance || 0;
                    
                    if (currentBalance < rubAmount) {
                        throw "Недостаточно средств на вашем личном балансе! Пожалуйста, перейдите в профиль и пополните его в меню ФИНАНСЫ.";
                    }
                    
                    transaction.update(orderRef, { 
                        status: 'on_hold',
                        buyerId: currentUser.id.toString(),
                        buyerName: currentUser.username,
                        rubHoldAmount: rubAmount
                    });
                    
                    transaction.update(userRef, {
                        balance: currentBalance - rubAmount,
                        frozenBalance: currentFrozen + rubAmount
                    });
                    
                    const purchaseId = `PCH_${Date.now()}`;
                    const purchaseRef = db.collection('purchases').doc(purchaseId);
                    transaction.set(purchaseRef, {
                        id: purchaseId,
                        orderId: orderId,
                        items: orderData.items,
                        totalUsd: totalWithCommission,
                        rubAmount: rubAmount,
                        cookie: orderData.cookie,
                        sellerId: orderData.sellerId,
                        seller: orderData.sellerName,
                        buyerId: currentUser.id.toString(),
                        buyerName: currentUser.username,
                        status: 'on_hold',
                        date: new Date().toISOString()
                    });
                });
                
                if (tg) tg.showAlert(`🔒 Лот успешно выкуплен в удержание! Средства заморожены до вашего подтверждения.`);
                if (sellerIdForChat && sellerNameForChat) {
                    await createOrGetChat(sellerIdForChat, sellerNameForChat);
                }
                await loadUserData();
                switchTab('myPurchases');
                
            } catch (error) {
                if (tg) tg.showAlert(`❌ Ошибка сделки: ${error}`);
                console.error(error);
            }
        }
        
        async function confirmEscrowPurchase(purchaseId) {
            if (!db) return;
            if (tg) tg.showScanQrPopup({ text: "Завершаем безопасную сделку..." });
            
            try {
                const purchaseRef = db.collection('purchases').doc(purchaseId);
                const purchaseDoc = await purchaseRef.get();
                const pData = purchaseDoc.data();
                
                const orderRef = db.collection('orders').doc(pData.orderId);
                const orderDoc = await orderRef.get();
                const oData = orderDoc.data();
                
                const buyerRef = db.collection('users').doc(pData.buyerId);
                const sellerRef = db.collection('users').doc(pData.sellerId);
                
                await db.runTransaction(async (transaction) => {
                    const bDoc = await transaction.get(buyerRef);
                    const sDoc = await transaction.get(sellerRef);
                    
                    const buyerFrozen = bDoc.data().frozenBalance || 0;
                    const sellerBalance = sDoc.data().balance || 0;
                    
                    transaction.update(buyerRef, {
                        frozenBalance: buyerFrozen - pData.rubAmount
                    });
                    
                    const sellerPayoutRub = oData.payoutUsd * exchangeRate;
                    transaction.update(sellerRef, {
                        balance: sellerBalance + sellerPayoutRub
                    });
                    
                    transaction.update(purchaseRef, { status: 'completed' });
                    transaction.update(orderRef, { status: 'sold' });
                });
                
                if (tg) tg.closeScanQrPopup();
                if (tg) tg.showAlert('✅ Сделка завершена! Средства переведены продавцу на баланс.');
                await addIncome(oData.commissionUsd);
                await loadUserData();
            } catch (err) {
                if (tg) tg.closeScanQrPopup();
                if (tg) tg.showAlert(`❌ Не удалось подтвердить сделку: ${err}`);
            }
        }

        async function cancelEscrowPurchase(purchaseId) {
            if (!db) return;
            if (!confirm('Вы действительно хотите отменить покупку лота и вернуть средства?')) return;
            
            try {
                const purchaseRef = db.collection('purchases').doc(purchaseId);
                
                await db.runTransaction(async (transaction) => {
                    const purchaseDoc = await transaction.get(purchaseRef);
                    if (!purchaseDoc.exists) throw "Покупка не найдена";
                    const pData = purchaseDoc.data();
                    
                    const orderRef = db.collection('orders').doc(pData.orderId);
                    const buyerRef = db.collection('users').doc(pData.buyerId);
                    
                    const bDoc = await transaction.get(buyerRef);
                    if (!bDoc.exists) throw "Покупатель не найден в базе данных";
                    
                    const buyerBalance = bDoc.data().balance || 0;
                    const buyerFrozen = bDoc.data().frozenBalance || 0;
                    
                    // Возвращаем средства покупателю на доступный баланс из удержания
                    transaction.update(buyerRef, {
                        balance: buyerBalance + pData.rubAmount,
                        frozenBalance: buyerFrozen - pData.rubAmount
                    });
                    
                    // Возвращаем лот в исходный статус продажи, удаляя информацию о покупателе
                    transaction.update(orderRef, {
                        status: 'pending',
                        buyerId: firebase.firestore.FieldValue.delete(),
                        buyerName: firebase.firestore.FieldValue.delete(),
                        rubHoldAmount: firebase.firestore.FieldValue.delete()
                    });
                    
                    // Удаляем документ покупки, так как операция отменена
                    transaction.delete(purchaseRef);
                });
                
                if (tg) tg.showAlert('❌ Сделка отменена. Ваши средства возвращены на баланс.');
                await loadUserData();
            } catch (err) {
                if (tg) tg.showAlert(`❌ Ошибка отмены: ${err}`);
                console.error(err);
            }
        }

                                <button class="btn btn-success" style="flex:1.2;font-size:11px;padding:6px;" onclick="confirmEscrowPurchase('${purchase.id}')">Confirm (Выйти с холда)</button>
                                <button class="btn btn-danger" style="flex:0.8;font-size:11px;padding:6px;" onclick="cancelEscrowPurchase('${purchase.id}')">Отменить</button>
                            ` : ''}
                        </div>
                    </div>
                `}).join('');
            }
        }
        
        function copyToClipboard(text) {
            navigator.clipboard.writeText(text);
            if (tg) tg.showAlert('✅ Кука скопирована');
        }
        
        function renderProfile() {
            const completedDeals = purchaseOrders.length;
            const totalWithdrawn = withdrawals.filter(w => w.status === 'completed').reduce((sum, w) => sum + w.amount, 0);
            let statusHtml = '';
            
            if (isAdmin) statusHtml = '<span class="scup-badge" style="background:var(--error)">⚙️ АДМИНИСТРАТОР</span>';
            else if (isTrustedScup) statusHtml = '<span class="scup-badge-verified">⭐️✅ ДОВЕРЕННЫЙ (6%)</span>';
            else if (isScup) statusHtml = '<span class="scup-badge">⭐️ СКУП (7%)</span>';
            
            document.getElementById('content').innerHTML = `
                <div class="page-title">ПРОФИЛЬ</div>
                <div style="background:var(--card-bg);border-radius:20px;padding:20px;border:1px solid var(--border);margin-bottom:16px;box-shadow:var(--shadow)">
                    <div style="display:flex;align-items:center;gap:16px;margin-bottom:16px">
                        <div style="width:60px;height:60px;border-radius:50%;background:linear-gradient(135deg, var(--gradient-start), var(--gradient-end));display:flex;align-items:center;justify-content:center;font-size:28px;color:white" id="profileAvatar">👤</div>
                        <div>
                            <div style="font-weight:bold;font-size:18px">${escapeHtml(currentUser?.first_name || 'Пользователь')}</div>
                            <div style="color:var(--text-secondary);font-size:12px">@${escapeHtml(currentUser?.username || 'username')} ${isAdmin ? '[АДМИНИСТРАТОР]' : ''}</div>
                            ${statusHtml ? `<div style="margin-top:8px">${statusHtml}</div>` : ''}
                        </div>
                    </div>
                    <div style="padding-top:12px;border-top:1px solid var(--border)">
                        <div style="display:flex;justify-content:space-between;margin-bottom:8px"><span>Telegram ID:</span><span>${currentUser?.id}</span></div>
                        <div style="display:flex;justify-content:space-between;margin-bottom:8px"><span>📊 Выкупов / Покупок:</span><span style="color:var(--success);font-weight:bold">${completedDeals}</span></div>
                        <div style="display:flex;justify-content:space-between;margin-bottom:8px"><span>💸 Выведено автовыводом:</span><span>${totalWithdrawn} USDT</span></div>
                    </div>
                </div>
            `;
            if (currentUser?.first_name) {
                document.getElementById('profileAvatar').innerText = currentUser.first_name[0].toUpperCase();
            }
        }
        
        function renderFinances() {
            const completedWithdrawals = withdrawals.filter(w => w.status === 'completed');
            const dayNames = ['Вс', 'Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб'];
            const monthNames = ['Янв', 'Фев', 'Мар', 'Апр', 'Май', 'Июн', 'Июл', 'Авг', 'Сен', 'Окт', 'Ноя', 'Дек'];
            document.getElementById('content').innerHTML = `
                <div class="page-title">ФИНАНСЫ</div>
                <div class="balance-card">
                    <div>💰 ДОСТУПНЫЙ БАЛАНС</div>
                    <div class="balance-amount">${balance.toFixed(2)} ₽</div>
                    <div style="font-size:14px;opacity:0.9">≈ $${(balance / exchangeRate).toFixed(2)} USDT</div>
                    <div style="display:flex;gap:12px;margin-top:20px">
                        <button class="btn" onclick="showDepositModal()">💳 ПОПОЛНИТЬ</button>
                        <button class="btn" onclick="showWithdrawModal()">💸 АВТОВЫВОД</button>
                    </div>
                </div>
                ${frozenBalance > 0 ? `<div class="frozen-card"><div style="display:flex;justify-content:space-between"><span>🔒 НА ХОЛДЕ (БЕЗОПАСНАЯ СДЕЛКА)</span><span style="color:var(--warning);font-weight:bold">${frozenBalance.toFixed(2)} ₽</span></div></div>` : ''}
                <div class="stats-cards">
                    <div class="stat-card-big"><div class="stat-value-big">$${incomeStats.day.toFixed(2)}</div><div class="stat-label-big">СЕГОДНЯ</div></div>
                    <div class="stat-card-big"><div class="stat-value-big">$${incomeStats.week.toFixed(2)}</div><div class="stat-label-big">НЕДЕЛЯ</div></div>
                    <div class="stat-card-big"><div class="stat-value-big">$${incomeStats.month.toFixed(2)}</div><div class="stat-label-big">МЕСЯЦ</div></div>
                    <div class="stat-card-big"><div class="stat-value-big">$${incomeStats.year.toFixed(2)}</div><div class="stat-label-big">ГОД</div></div>
                </div>
                <div class="chart-container"><canvas id="financeDailyChart"></canvas></div>
                <div class="chart-container"><canvas id="financeMonthlyChart"></canvas></div>
                <div style="background:var(--card-bg);border-radius:20px;padding:20px;margin-bottom:16px;border:1px solid var(--border)">
                    <div style="font-weight:bold;margin-bottom:12px">📊 ИСТОРИЯ АВТОВЫВОДОВ</div>
                    ${completedWithdrawals.length === 0 ? '<div class="empty-state">История чиста</div>' : completedWithdrawals.map(w => `<div class="history-item"><div style="display:flex;justify-content:space-between"><span>💸 Выведено ${w.amount} USDT</span><span class="status-completed">✅ Успешно</span></div><div class="history-date">${new Date(w.createdAt).toLocaleString()}</div></div>`).join('')}
                </div>
            `;
            const ctx1 = document.getElementById('financeDailyChart')?.getContext('2d');
            if (ctx1) new Chart(ctx1, { type: 'bar', data: { labels: dayNames, datasets: [{ label: 'Доход (USDT)', data: incomeStats.dailyData, backgroundColor: 'rgba(76, 175, 80, 0.6)', borderColor: '#4caf50', borderWidth: 1 }] }, options: { responsive: true, maintainAspectRatio: true } });
            const ctx2 = document.getElementById('financeMonthlyChart')?.getContext('2d');
            if (ctx2) new Chart(ctx2, { type: 'line', data: { labels: monthNames, datasets: [{ label: 'Доход (USDT)', data: incomeStats.monthlyData, backgroundColor: 'rgba(76, 175, 80, 0.2)', borderColor: '#4caf50', borderWidth: 2, fill: true, tension: 0.4 }] }, options: { responsive: true, maintainAspectRatio: true } });
        }
        
        function showDepositModal() {
            const modal = document.createElement('div');
            modal.className = 'modal';
            modal.innerHTML = `<div class="modal-content"><h3 style="margin-bottom:16px">💰 ПОПОЛНЕНИЕ БАЛАНСА</h3><p style="color:var(--text-secondary);margin-bottom:8px">💱 Текущий курс бота: 1 USDT = ${exchangeRate.toFixed(2)} RUB</p><input type="number" id="depositAmount" class="search-input" placeholder="Сумма в USDT" min="1" step="1"><button class="btn btn-success" style="margin-bottom:8px" onclick="confirmDeposit()">СОЗДАТЬ ЧЕК В БОТЕ</button><button class="btn" style="background:var(--input-bg);color:var(--text-primary)" onclick="closeModal()">ОТМЕНА</button></div>`;
            document.body.appendChild(modal);
        }
        
        async function confirmDeposit() {
            const amount = parseFloat(document.getElementById('depositAmount')?.value);
            if (!amount || amount < 1) { if (tg) tg.showAlert('❌ Минимальная сумма: 1 USDT'); return; }
            closeModal();
            await deposit(amount);
        }
        
        function showWithdrawModal() {
            const modal = document.createElement('div');
            modal.className = 'modal';
            modal.innerHTML = `<div class="modal-content"><h3 style="margin-bottom:16px">💸 МОМЕНТАЛЬНЫЙ АВТОВЫВОД</h3><p style="font-size:12px;color:var(--text-secondary);margin-bottom:12px;">Вывод отправляется через Crypto Bot Transfer на указанный цифровой Telegram ID.</p><input type="number" id="withdrawAmount" class="search-input" placeholder="Сумма в USDT" min="10" step="1"><input type="number" id="withdrawTelegramId" class="search-input" placeholder="Ваш Telegram ID (например: ${currentUser?.id || '123456'})" value="${currentUser?.id || ''}" style="margin-top:8px"><button class="btn btn-success" style="margin:16px 0 8px" onclick="confirmWithdraw()">💸 ЗАПРОСИТЬ ВЫПЛАТУ</button><button class="btn" style="background:var(--input-bg);color:var(--text-primary)" onclick="closeModal()">ОТМЕНА</button></div>`;
            document.body.appendChild(modal);
        }
        
        async function confirmWithdraw() {
            const amount = parseFloat(document.getElementById('withdrawAmount')?.value);
            const tgId = document.getElementById('withdrawTelegramId')?.value;
            if (!amount || amount < 10) { if (tg) tg.showAlert('❌ Минимальная сумма: 10 USDT'); return; }
            if ((amount * exchangeRate) > balance) { if (tg) tg.showAlert('❌ Недостаточно средств на балансе'); return; }
            if (!tgId) { if (tg) tg.showAlert('❌ Укажите Telegram ID получателя'); return; }
            closeModal();
            await requestWithdraw(amount, tgId);
        }
        
        // ==================== PANELS ADMIN ====================
        async function renderModerka() {
            if (!isAdmin) { switchTab('home'); return; }
            
            let supportTickets = [];
            if (db) {
                try {
                    const supportSnapshot = await db.collection('supportTickets').where('status', '==', 'open').get();
                    supportSnapshot.forEach(doc => supportTickets.push({ id: doc.id, ...doc.data() }));
                } catch(e) { console.error(e); }
            }
            
            document.getElementById('content').innerHTML = `
                <div class="page-title">МОДЕРКА</div>
                <div class="page-subtitle">Панель администратора</div>
                <div style="background:linear-gradient(135deg, var(--gradient-start), var(--gradient-end)); border-radius:20px; padding:20px; margin-bottom:20px; color:white">
                    <div style="font-size:14px; opacity:0.9">💰 ОБЩИЙ ДОХОД МАРКЕТА</div>
                    <div style="font-size:36px; font-weight:bold; margin:10px 0">$${incomeStats.allTime.toFixed(2)}</div>
                </div>
                <div style="background:var(--card-bg); border-radius:20px; padding:20px; margin-bottom:20px; border:1px solid var(--border)">
                    <div style="font-weight:bold; margin-bottom:16px">🆘 АКТИВНЫЕ ТИКЕТЫ ТЕХПОДДЕРЖКИ (${supportTickets.length})</div>
                    ${supportTickets.length === 0 ? '<div class="empty-state">Нет открытых тикетов</div>' : supportTickets.map(t => `
                        <div class="withdraw-request" style="border-left: 4px solid var(--error)">
                            <div>👤 Пользователь: @${escapeHtml(t.userName)} (ID: ${t.userId})</div>
                            <div style="margin: 8px 0; font-size:14px; color: var(--text-primary)">💬 ${escapeHtml(t.message)}</div>
                            <div style="font-size:11px; color:var(--text-secondary)">📅 ${new Date(t.createdAt).toLocaleString()}</div>
                            <div style="display:flex; gap:8px; margin-top:10px;">
                                <button class="btn btn-success" style="padding:6px; flex: 1;" onclick="openSupportTicketChat('${t.userId}', '${escapeHtml(t.userName)}')">💬 ОТВЕТИТЬ</button>
                                <button class="btn btn-danger" style="padding:6px; flex: 1;" onclick="closeSupportTicket('${t.id}')">✅ ЗАКРЫТЬ ТИКЕТ</button>
                            </div>
                        </div>
                    `).join('')}
                </div>
                <div style="background:var(--card-bg); border-radius:20px; padding:20px; margin-bottom:20px; border:1px solid var(--border)">
                    <div style="font-weight:bold; margin-bottom:16px">💰 РЕДАКТИРОВАНИЕ БАЗОВЫХ ЦЕН</div>
                    <div id="productsPriceList" style="max-height:300px; overflow-y:auto"></div>
                </div>
                <div style="background:var(--card-bg); border-radius:20px; padding:20px; margin-bottom:20px; border:1px solid var(--border)">
                    <div style="font-weight:bold; margin-bottom:16px">👥 НАЗНАЧИТЬ СКУПА</div>
                    <input type="text" id="scupUsername" class="search-input" placeholder="@username Telegram">
                    <div style="display:flex; gap:12px; margin-top:12px">
                        <button class="btn" onclick="assignScup(document.getElementById('scupUsername').value, false)" style="flex:1">⭐ ОБЫЧНЫЙ (7%)</button>
                        <button class="btn" onclick="assignScup(document.getElementById('scupUsername').value, true)" style="flex:1; background:linear-gradient(135deg, #ff9800, #ff5722)">⭐✅ ДОВЕРЕННЫЙ (6%)</button>
                    </div>
                </div>
                <div style="background:var(--card-bg); border-radius:20px; padding:20px; margin-bottom:20px; border:1px solid var(--border)">
                    <div style="font-weight:bold; margin-bottom:16px">👥 СПИСОК СКУПОВ</div>
                    <div id="scupsListContainer"></div>
                </div>
            `;
            
            const priceContainer = document.getElementById('productsPriceList');
            if (priceContainer) {
                priceContainer.innerHTML = allProducts.map(p => `
                    <div class="price-edit-row">
                        <div style="font-size:13px; flex:2">${p.name}</div>
                        <input type="number" id="price_${p.id}" value="${p.priceUsd}" step="0.01">
                        <button class="btn" onclick="updateProductPrice(${p.id})">💾</button>
                    </div>
                `).join('');
            }
            const scupsContainer = document.getElementById('scupsListContainer');
            if (scupsList.length === 0) {
                scupsContainer.innerHTML = '<div class="empty-state">Нет назначенных скупов</div>';
            } else {
                scupsContainer.innerHTML = scupsList.map(s => `
                    <div class="scup-item">
                        <div class="scup-info">
                            <span>👤 @${escapeHtml(s.username)}</span>
                            ${s.type === 'trusted' ? '<span class="scup-badge-verified">⭐️✅ ДОВЕРЕННЫЙ</span>' : '<span class="scup-badge">⭐️ СКУП</span>'}
                        </div>
                    </div>
                `).join('');
            }
        }
        
        async function assignScup(username, isTrusted) {
            if (!isAdmin || !db || !username.trim()) return;
            const cleanUsername = username.trim().replace('@', '');
            
            try {
                const usersSnapshot = await db.collection('users').where('username', '==', cleanUsername).get();
                if (usersSnapshot.empty) { if (tg) tg.showAlert('❌ Пользователь не найден в базе данных бота'); return; }
                
                const userId = usersSnapshot.docs[0].id;
                
                await db.collection('users').doc(userId).update({ 
                    isScup: !isTrusted, 
                    isTrustedScup: isTrusted 
                });
                
                const existingIndex = scupsList.findIndex(s => s.userId === userId);
                const scupType = isTrusted ? 'trusted' : 'regular';
                
                if (existingIndex !== -1) {
                    scupsList[existingIndex].type = scupType;
                    const scupDocId = scupsList[existingIndex].id;
                    if(scupDocId) await db.collection('scups').doc(scupDocId).update({ type: scupType });
                } else {
                    const newScup = { userId, username: cleanUsername, type: scupType, totalCommission: 0, createdAt: new Date().toISOString() };
                    const docRef = await db.collection('scups').add(newScup);
                    newScup.id = docRef.id;
                    scupsList.push(newScup);
                }
                if (tg) tg.showAlert('✅ Назначен статус для ' + cleanUsername);
                await loadUserData();
                renderModerka();
            } catch(e) { console.error(e); }
        }
        
        function closeModal() { document.querySelectorAll('.modal').forEach(m => m.remove()); }
        function escapeHtml(text) { if (!text) return ''; const div = document.createElement('div'); div.textContent = text; return div.innerHTML; }
        
        // ==================== NAVIGATION ====================
        function switchTab(tab) {
            currentTab = tab;
            renderCurrentTab();
            renderTabBar();
        }
        
        function renderCurrentTab() {
            const floatingBar = document.getElementById('floatingBar');
            if (currentTab !== 'sell') floatingBar.classList.add('hidden');
            if (currentTab === 'home') renderHome();
            else if (currentTab === 'sell') renderSell();
            else if (currentTab === 'mySales') renderMySales();
            else if (currentTab === 'scupka') renderScupka();
            else if (currentTab === 'myPurchases') renderMyPurchases();
            else if (currentTab === 'profile') renderProfile();
            else if (currentTab === 'finances') renderFinances();
            else if (currentTab === 'moderka') renderModerka();
            else if (currentTab === 'chats') renderChatList();
            else renderHome();
        }
        
        function renderTabBar() {
            const tabs = [
                { id: 'home', label: 'ГЛАВНАЯ', icon: '🏠' },
                { id: 'sell', label: 'ПРОДАЖА', icon: '📦' },
                { id: 'mySales', label: 'МОИ ПРОДАЖИ', icon: '📋' }
            ];
            if (isScup || isTrustedScup || isAdmin) {
                tabs.push({ id: 'scupka', label: 'СКУПКА', icon: '💰' });
                tabs.push({ id: 'myPurchases', label: 'УПРАВЛЕНИЕ ХОЛДОМ', icon: '🛍️' });
            }
            if (isAdmin) {
                tabs.push({ id: 'moderka', label: 'МОДЕРКА', icon: '⚙️' });
            }
            document.getElementById('tabBar').innerHTML = tabs.map(t => `
                <button class="tab-btn ${currentTab === t.id ? 'active' : ''}" data-tab="${t.id}" onclick="switchTab('${t.id}')">
                    <span class="tab-icon">${t.icon}</span>
                    <span>${t.label}</span>
                </button>
            `).join('');
        }
        
        // ==================== INITIALIZATION ====================
        loadProductPrices();
        
        if (tg) {
            tg.ready();
            tg.expand();
            const tgUser = tg.initDataUnsafe?.user;
            if (tgUser) {
                currentUser = { id: tgUser.id, first_name: tgUser.first_name || 'Пользователь', username: tgUser.username || `user${tgUser.id}` };
                document.querySelector('#avatarBtn').innerHTML = (currentUser.first_name ? currentUser.first_name[0] : '👤').toUpperCase();
                loadUserData().then(() => { fetchExchangeRate(); });
            } else {
                currentUser = { id: 777333111, first_name: "Тест Скуп", username: "scup_test" };
                document.querySelector('#avatarBtn').innerHTML = "T";
                loadUserData().then(() => { fetchExchangeRate(); });
            }
        } else {
            currentUser = { id: 777333111, first_name: "Тест Скуп", username: "scup_test" };
            document.querySelector('#avatarBtn').innerHTML = "T";
            loadUserData().then(() => { fetchExchangeRate(); });
        }
        
        document.getElementById('themeToggle')?.addEventListener('click', toggleTheme);
        document.getElementById('avatarBtn')?.addEventListener('click', () => document.getElementById('userMenu')?.classList.toggle('hidden'));
        document.getElementById('profileBtn')?.addEventListener('click', () => { document.getElementById('userMenu')?.classList.add('hidden'); switchTab('profile'); });
        document.getElementById('financesBtn')?.addEventListener('click', () => { document.getElementById('userMenu')?.classList.add('hidden'); switchTab('finances'); });
        document.getElementById('supportBtn')?.addEventListener('click', () => { document.getElementById('userMenu')?.classList.add('hidden'); sendSupportRequest(); });
        document.getElementById('logoutBtn')?.addEventListener('click', () => { document.getElementById('userMenu')?.classList.add('hidden'); if(tg) tg.close(); });
        document.getElementById('chatBtn')?.addEventListener('click', () => { document.getElementById('userMenu')?.classList.add('hidden'); switchTab('chats'); });
        
        window.switchTab = switchTab;
        window.setMode = setMode;
        window.cancelSale = cancelSale;
        window.buyAsScup = buyAsScup;
        window.confirmDeposit = confirmDeposit;
        window.confirmWithdraw = confirmWithdraw;
        window.closeModal = closeModal;
        window.showDepositModal = showDepositModal;
        window.showWithdrawModal = showWithdrawModal;
        window.assignScup = assignScup;
        window.copyToClipboard = copyToClipboard;
        window.updateProductPrice = updateProductPrice;
        window.openChat = openChat;
        window.renderChatList = renderChatList;
        window.closeSupportTicket = closeSupportTicket;
        window.openSupportTicketChat = openSupportTicketChat;
        window.checkInvoiceStatus = checkInvoiceStatus;
        window.confirmEscrowPurchase = confirmEscrowPurchase;
        window.cancelEscrowPurchase = cancelEscrowPurchase;
        
        initTheme();
        renderTabBar();
    </script>
</body>
</html>
